<style>
  /* County map: a picker beside the county list on wider screens; small
     versions show the chosen county on the heading (phones) and in the
     chosen county's box */
  .cmap path { fill: var(--icon-gray); transition: fill 0.3s ease; }
  .county-pick .county-list a { transition: color 0.3s ease, text-decoration-color 0.3s ease; }
  .county-map path { cursor: pointer; }
  .county-map path.hl, .cmap path.on { fill: var(--dark-hover); }
  .cmap.has-pick path:not(.on) { fill: #9aa1a8; }
  .chosen-map path { stroke: rgba(255, 255, 255, 0.4); stroke-width: 0.3; stroke-linejoin: bevel; }
  /* The chosen county sits on top of its neighbors' outlines, a little
     fattened, so small ones like Salt Lake and Piute still show */
  .chosen-map path.on { fill: #212529; stroke: #212529; stroke-width: 1.4; stroke-linejoin: round; }
  /* A light gray ring just outside it, drawn by a copy underneath */
  .chosen-map path.halo { fill: #dee2e6; stroke: #dee2e6; stroke-width: 2.6; stroke-linejoin: round; }
  /* Both stay inside Utah (and out of the Great Salt Lake), so border counties don't bulge past the state line */
  .chosen-map path.halo { clip-path: url(#ut-clip); }
  /* The chosen county stays inside the state line */
  .chosen-map path.on { clip-path: url(#ut-clip); }
  
  /* The list and map sit in a Bootstrap row: list col-md-8, map col-md-4 */
  .county-map { display: block; transition: opacity 0.25s ease; }
  .county-pick-map .county-map { left: -2.25rem !important; } /* pulled into the gap, closer to the list */
  .county-map.fade-out { opacity: 0; }
  .county-list a.hl { color: var(--dark-hover) !important; text-decoration-thickness: 2px; }
  /* Not Bootstrap columns: the list's text columns and the map share one
     grid of equal columns, so the map is exactly one column wide */
  @media (min-width: 768px) {
    .county-pick { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 2.25rem; }
    .county-pick-list { grid-column: span 3; }
    .county-pick .county-list { columns: 3; column-gap: 2.25rem;
      /* Dotted rules centered in the column gaps; dots 6px apart */
      background: radial-gradient(circle at calc(100% - 1.125rem) 50%, #a7aeb5 0.6px, transparent 0.9px) 0 0 / calc((100% + 2.25rem) / 3) 4px repeat; }
    /* Dotted rule on the list's left edge */
    .county-pick-list { background: radial-gradient(circle at 1px 50%, #a7aeb5 0.6px, transparent 0.9px) 0 0 / 2px 4px repeat-y; }
  }
  @media (min-width: 1200px) {
    .county-pick { grid-template-columns: repeat(5, 1fr); }
    .county-pick-list { grid-column: span 4; }
    .county-pick .county-list { columns: 4; background-size: calc((100% + 2.25rem) / 4) 4px; }
  }
  .chosen-map { height: 2em; width: auto; flex: none; margin-right: 0.5em; }
  /* Map and county name centered up and down in the button */
  #county-chosen:not([hidden]) { display: inline-flex; align-items: center; }
  @media (prefers-reduced-motion: reduce) { .cmap path, .county-map { transition: none; } }
</style>
<style>
  /* County list gets more columns since the names are short */
  .county-list {
    columns: 2;
  }
  @media (min-width: 576px) {
    .county-list {
      columns: 3;
    }
  }
  @media (min-width: 768px) {
    .county-list {
      columns: 4;
    }
  }
  @media (min-width: 992px) {
    .county-list {
      columns: 5;
    }
  }
  /* Picking a county fades out the list; the chosen one shows in a box
     above the rule */
  .county-list li {
    transition: opacity 0.25s ease;
  }
  .county-list li.fade-out {
    opacity: 0;
  }
  /* Circled x in the chosen county's top right corner */
  .county-close {
    position: absolute;
    top: -0.5rem;
    right: -0.5rem;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background-color: #6c757d;
    color: #fff;
    font-size: 0.75rem;
    line-height: 1rem;
    text-align: center;
  }
  /* Town list without the card look until a county is picked */
  .card-off {
    border-color: transparent;
    background: none;
  }
  .card-off > .card-body {
    padding: 0 !important; /* beats py-3 */
  }
  #county-chosen:hover .county-close { background-color: var(--dark-hover); }
  @media (prefers-reduced-motion: reduce) {
    .county-list li {
      transition: none;
    }
  }
  /* Phones: bigger tagline icon in the photo's top right corner, in line
     with the page's side padding */
  .tagline-icon-pop {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 4.5rem;
    height: 4.5rem;
    filter: drop-shadow(0 0.25rem 0.5rem rgba(0, 0, 0, 0.35));
  }
  /* Tagline box: 1.5px slightly see-through white border; normal text
     wrapping, but no word left alone on the last line */
  .skew-box-inner h1,
  .skew-box-inner p { text-wrap: pretty; }
  .skew-box {
    border-width: 1.5px !important;
    border-color: rgba(255, 255, 255, 0.75) !important;
  }
  /* Smaller heading and tagline on phones and small tablets */
  @media (max-width: 767.98px) {
    .skew-box-inner h1 { font-size: 1.45rem; }
    .skew-box-inner .lead { font-size: 1rem !important; }
  }
  /* Band at the top: photo from config/photos.json ("homePhoto" in
     config/site.json). Phones get the smaller version. */
  .home-band {
    height: 350px; /* phones */
    background: url("{Home Photo Mobile}") center bottom / cover no-repeat;
  }
  @media (min-width: 768px) {
    .home-band {
      height: 480px;
      background-image: url("{Home Photo Desktop}");
    }
  }
  /* With ads showing, a shorter photo on large screens so the top of the
     content still shows below the banner ad */
  @media (min-width: 992px) {
    .home-band-ads {
      height: 400px;
    }
  }
  /* Parallax: the photo stays put while the page scrolls. Left off on
     touch screens (iOS doesn't support it) and for reduced motion. */
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .home-band {
      background-attachment: fixed;
    }
  }
</style>

    <!-- With a county picked, its towns sit in a card like Nearby
         Communities on town pages, its top border where the rule was -->

      <div class="card-body py-3">
        <ul id="profile-list" class="list-unstyled town-list font-zilla mb-0">
          {Profile Items}
        </ul>
      </div>
    </div>
  </section>

</div>

<script>
  // Clicking a county fades out the county list and shows the chosen county
  // in a box above the rule. Its communities show below. The circled x in
  // the box's corner clears the county and brings the list back. Typing searches town names only,
  // across every county (or just the chosen county's).
  (() => {
    let county = "";
    // While searching with no county picked, the list folds into a
    // "Filter by county" button; clicking it opens the list again.
    let expanded = false;
    const toggle = document.getElementById("county-toggle");
    const title = document.getElementById("county-title");
    const chosenBox = document.getElementById("county-chosen");
    const chosenName = document.getElementById("county-chosen-name");
    // Clicking anywhere else on the page also clears the county, except in
    // the search box, the town list or the county list
    document.addEventListener("click", (e) => {
      if (!county) return;
      if (
        e.target.closest(
          "#county-chosen, #profile-search, #profile-card, #county-list",
        )
      )
        return;
      county = "";
      update();
    });
    // The whole chosen-county box clears the county, not just its x
    chosenBox.addEventListener("click", () => {
      county = "";
      update();
    });
    let listTimer;
    toggle.addEventListener("click", () => {
      expanded = true;
      update();
    });
    const search = document.getElementById("profile-search");
    const message = document.getElementById("profile-message");
    const items = document.querySelectorAll("#profile-list li");
    const countyList = document.getElementById("county-list");
    countyList.addEventListener("click", (e) => {
      const link = e.target.closest("li a");
      if (!link) return;
      e.preventDefault();
      county = link.parentElement.dataset.county;
      update();
      // Scroll to the chosen county's button, with its towns below it (stops
      // below the sticky header). Waits for the county list to fade out.
      const reduce = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      setTimeout(() => {
        document
          .getElementById("county-chosen")
          .scrollIntoView({
            behavior: reduce ? "auto" : "smooth",
            block: "start",
          });
      }, 260);
    });
    function update() {
      const c = county;
      const q = search.value.trim().toLowerCase();
      if (!q) expanded = false;
      const folded = !c && Boolean(q) && !expanded;
      title.hidden = folded || Boolean(c);
      chosenBox.hidden = !c;
      // With a county picked, the card's top border takes the rule's place,
      // and the rule above the ads isn't needed
      const heading = document.getElementById("county-heading");
      heading.classList.toggle("rule-solid", !c);
      heading.classList.toggle("mb-3", !c);
      const adsRule = document.getElementById("home-ads-rule");
      if (adsRule) adsRule.hidden = Boolean(c);
      const card = document.getElementById("profile-card");
      card.classList.toggle("card-off", !c);
      card.classList.toggle("shadow-sm", Boolean(c));
      chosenBox.setAttribute(
        "aria-label",
        c ? `Clear county: ${c} County` : "Clear county",
      );
      chosenName.textContent = c ? `${c} County` : "";
      clearTimeout(listTimer);
      if (c)
        listTimer = setTimeout(() => {
          countyList.hidden = true;
        }, 250);
      else countyList.hidden = folded;
      toggle.hidden = !folded;
      toggle.setAttribute("aria-expanded", String(!folded));
      let shown = 0;
      items.forEach((li) => {
        const match =
          Boolean(c || q) &&
          (!c || li.dataset.county === c) &&
          (!q || li.dataset.name.includes(q)); // town names only, not counties
        li.hidden = !match;
        // County shows after the name only when no county is picked
        li.querySelector(".county-suffix").hidden = Boolean(c);
        if (match) shown++;
      });
      countyList.querySelectorAll("li").forEach((li) => {
        clearTimeout(li.fadeTimer);
        if (c) {
          // Fade out, then take it out of the list
          if (li.hidden) return;
          li.classList.add("fade-out");
          li.fadeTimer = setTimeout(() => {
            li.hidden = true;
          }, 250);
        } else if (li.hidden || li.classList.contains("fade-out")) {
          // Bring it back and fade it in
          li.hidden = false;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => li.classList.remove("fade-out")),
          );
        }
      });
      message.hidden = !(c || q) || shown > 0;
      // Phone hints: every match, best (name starts with it) first
      const found = q ? [...items].filter((li) => !li.hidden)
        .sort((a, b) => a.dataset.name.indexOf(q) - b.dataset.name.indexOf(q) || a.dataset.name.localeCompare(b.dataset.name)) : [];
      hints.innerHTML = found.map((li) => {
        const a = li.querySelector("a");
        return `<a href="${a.getAttribute("href")}">${a.firstChild.textContent} <span class="text-secondary">(${li.dataset.county})</span></a>`;
      }).join("");
      hints.scrollTop = 0;
      fitHints();
      // Phones show matches in the hints only, not in the list below
      document.getElementById("community-profiles").classList.toggle("searching", Boolean(q));
    }
    const hints = document.getElementById("profile-hints");
    // Tapping elsewhere closes the hints; tapping the box again brings them back
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-hints-box")) { hints.hidden = true; drawBar(); }
    });
    search.addEventListener("focus", () => { hints.hidden = false; });
    // Phones: the box slides up under the header, and the hints stretch
    // down to the top of the keyboard
    const phone = window.matchMedia("(max-width: 767.98px)");
    const vv = window.visualViewport;
    function fitHints() {
      if (!phone.matches || !vv) return;
      const room = vv.height - (search.getBoundingClientRect().bottom - vv.offsetTop) - 8;
      // Four towns tall, or less if the keyboard leaves less room
      const four = hints.firstElementChild ? hints.firstElementChild.offsetHeight * 4 : 0;
      hints.style.maxHeight = Math.min(four || room, Math.max(room, 120)) + "px";
      drawBar();
    }
    // A thin scroll bar drawn over the hints' right edge, since phones hide
    // theirs until you scroll
    const bar = document.getElementById("hints-bar");
    function drawBar() {
      const h = hints.clientHeight, full = hints.scrollHeight;
      bar.hidden = hints.hidden || !h || full <= h + 1;
      if (bar.hidden) return;
      const size = Math.max(h * h / full, 24);
      bar.style.height = size + "px";
      bar.style.top = hints.offsetTop + 4 + (h - size - 8) * hints.scrollTop / (full - h) + "px";
    }
    hints.addEventListener("scroll", drawBar);
    search.addEventListener("focus", () => {
      if (!phone.matches) return;
      document.getElementById("community-profiles").classList.add("search-room");
      setTimeout(() => {
        search.scrollIntoView({ block: "start", behavior: "smooth" });
        setTimeout(fitHints, 400);
      }, 300);
    });
    if (vv) {
      vv.addEventListener("resize", fitHints);
      vv.addEventListener("scroll", fitHints);
    }
    search.addEventListener("blur", () => {
      setTimeout(() => {
        if (document.activeElement !== search)
          document.getElementById("community-profiles").classList.remove("search-room");
      }, 300);
    });
    search.addEventListener("input", () => { hints.hidden = false; });
    search.addEventListener("input", update);
    update();
  })();
</script>
<script>
  // County map: hovering a county on the map or in the list lights up both;
  // clicking the map picks the county the same way the list does. The small
  // maps fill in the chosen county.
  (() => {
    const list = document.getElementById("county-list");
    const big = document.querySelector(".county-map");
    const linkFor = (c) => list.querySelector(`li[data-county="${c}"] a`);
    // One county lit at a time: whichever was hovered or tabbed to most
    // recently (if the mouse leaves, the focused one comes back, and back)
    let hoverC = "", focusC = "", hoverT = 0, focusT = 0, tick = 0;
    const paint = () => {
      const c = hoverC && (!focusC || hoverT > focusT) ? hoverC : focusC;
      document.querySelectorAll(".county-map path.hl, #county-list a.hl").forEach((el) => el.classList.remove("hl"));
      if (!c) return;
      document.querySelectorAll(`.county-map path[data-county="${c}"]`).forEach((p) => p.classList.add("hl"));
      const a = linkFor(c); if (a) a.classList.add("hl");
    };
    const light = (c, on) => { if (on) { hoverC = c; hoverT = ++tick; } else if (hoverC === c) hoverC = ""; paint(); };
    const lightFocus = (c, on) => { if (on) { focusC = c; focusT = ++tick; } else if (focusC === c) focusC = ""; paint(); };
    big.addEventListener("mouseover", (e) => { const p = e.target.closest("path"); if (p) light(p.dataset.county, true); });
    big.addEventListener("mouseout", (e) => { const p = e.target.closest("path"); if (p) light(p.dataset.county, false); });
    big.addEventListener("click", (e) => {
      const p = e.target.closest("path"); if (!p) return;
      e.stopPropagation(); // keep the page's click-away handler from clearing it
      light(p.dataset.county, false);
      linkFor(p.dataset.county).click();
    });
    list.addEventListener("mouseover", (e) => { const li = e.target.closest("li"); if (li) light(li.dataset.county, true); });
    list.addEventListener("mouseout", (e) => { const li = e.target.closest("li"); if (li) light(li.dataset.county, false); });
    list.addEventListener("focusin", (e) => { const li = e.target.closest("li"); if (li) lightFocus(li.dataset.county, true); });
    list.addEventListener("focusout", (e) => { const li = e.target.closest("li"); if (li) lightFocus(li.dataset.county, false); });
        // The whole list-and-map row goes with the county list, so its margins
    // don't leave a gap above the towns once a county is picked
    const row = document.querySelector(".county-pick");
    new MutationObserver(() => {
      row.hidden = list.hidden;
    }).observe(list, { attributes: true, attributeFilter: ["hidden"] });
    const name = document.getElementById("county-chosen-name");
    // Escape clears the chosen county (same as the button) and puts focus
    // back on that county in the list, so keyboard users aren't stuck
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      const box = document.getElementById("county-chosen");
      if (box.hidden) return;
      const c = name.textContent.replace(/ County$/, "");
      box.click();
      requestAnimationFrame(() => { const a = linkFor(c); if (a) a.focus(); });
    });
    new MutationObserver(() => {
      const c = name.textContent.replace(/ County$/, "");
      big.classList.toggle("fade-out", Boolean(c));
      document.querySelectorAll(".chosen-map path.halo").forEach((h) => h.remove());
      document.querySelectorAll(".chosen-map path[data-county]").forEach((p) => {
        p.classList.toggle("on", p.dataset.county === c);
        if (p.dataset.county !== c) return;
        // Draw it last, on top, with a white copy under it for the ring
        const halo = p.cloneNode();
        halo.setAttribute("class", "halo");
        halo.removeAttribute("data-county");
        p.parentNode.appendChild(halo);
        p.parentNode.appendChild(p);
      });
    }).observe(name, { childList: true, characterData: true, subtree: true });
  })();
</script>
