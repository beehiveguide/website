<link rel="preconnect" href="https://basemap.nationalmap.gov" />
<link rel="stylesheet" href="leaflet/leaflet.css?v={Version}" />
<style>
  /* Search bar on top, then the map filling the rest of the screen */
  /* Exactly the screen's height (dvh leaves out phone browser toolbars), so
     the page itself doesn't scroll */
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  main { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .map-wrap { position: relative; flex: 1 1 auto; }
  #full-map { position: absolute; inset: 0; }
  .map-bar { position: relative; z-index: 1010; } /* results drop over the map */
  .map-search-box { position: relative; max-width: 26rem; flex: 1 1 18rem; }
  .map-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background-color: #fff;
    border-radius: 0 0 0.25rem 0.25rem;
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
  }
  .map-results:empty { display: none; }
  /* Phones: the heading hides (screen readers still hear it) and the
     search box says "Find a community" instead */
  @media (max-width: 767.98px) {
    .map-title {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
    }
  }
  .map-results button {
    display: block;
    width: 100%;
    padding: 0.35rem 0.75rem;
    text-align: left;
    background: none;
    border: 0;
    border-top: 1px solid #dee2e6;
    color: #212529;
  }
  .map-results button:hover,
  .map-results button:focus { background-color: #f8f9fa; }
</style>

<div class="map-bar bg-light-gradient border-bottom shadow">
  <div class="container-fluid px-lg-5 py-2 d-flex flex-wrap align-items-center gap-2">
    <h1 class="map-title fs-6 fw-bold lh-base mb-0 me-2"><label for="map-search"><svg viewBox="0 0 100 100" class="map-bar-icon me-1" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M50.00 0.76 L92.64 25.38 L92.64 74.62 L50.00 99.24 L7.36 74.62 L7.36 25.38 Z M46.10 11.33 Q50.00 9.08 53.90 11.33 L81.54 27.29 Q85.44 29.54 85.44 34.04 L85.44 65.96 Q85.44 70.46 81.54 72.71 L53.90 88.67 Q50.00 90.92 46.10 88.67 L18.46 72.71 Q14.56 70.46 14.56 65.96 L14.56 34.04 Q14.56 29.54 18.46 27.29 Z"/><path fill="currentColor" fill-rule="evenodd" transform="translate(50 51) scale(1.15) translate(-50 -50)" d="M34.55 30 H53.1 V38 H65.45 V70 H34.55 Z"/></svg>Find a community</label></h1>
    <div class="map-search-box">
      <input id="map-search" type="search" class="form-control" placeholder="Enter a town or city name ..." autocomplete="off" />
      <div id="map-results" class="map-results font-sans small"></div>
    </div>
  </div>
</div>
<div class="map-wrap">
  <div id="full-map" role="region" aria-label="Map of Utah communities"></div>
  <div class="map-corner">
    <a href="{About URL}" class="map-corner-btn btn btn-light-box font-sans">&copy; {Year} {Site Name}.</a>{Privacy Button}
  </div>
</div>

<script defer src="leaflet/leaflet.js?v={Version}"></script>
<script defer src="js/maps.js?v={Version}"></script>
<script>
  // Runs once the deferred map scripts above have loaded
  addEventListener("DOMContentLoaded", () => {
    // Courthouse after the county link when the town is the county seat (not a link)
    const SEAT_ICON = {Seat Icon JSON};
    // Town popup, shared with town pages (templates/parts/town-popup.html)
    const POPUP = {Town Popup JSON};
    // [name, county, lat, lng, page, county seat (1 or 0)] for every community
    const places = {Map Places JSON};
    // Dots draw on a canvas, which lets a tap a little off a dot still pick
    // it (fingers are bigger than the dots)
    const map = beehiveMap("full-map", {
      zoomControl: false,
      renderer: L.canvas({ tolerance: L.Browser.mobile ? 10 : 2 }),
    });
    // Zoom buttons on the right so they don't sit on the panel
    L.control.zoom({ position: "topright" }).addTo(map);

    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const openIn = (name, lat, lng) => [
      ["Google Maps", `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`],
      ["Apple Maps", `https://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(name + ", Utah")}`],
      ["OpenStreetMap", `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=14/${lat}/${lng}`],
    ].map(([n, u]) => `<a href="${u}" class="link-dark">${n}</a>`).join(" &middot; ");

    // Dots are small hexagons with rounded corners, point up like the
    // logo's, drawn on the canvas. Sized to cover about the same area as a
    // circle of the same radius; taps still use the circle around it.
    const HexMarker = L.CircleMarker.extend({
      _updatePath() {
        const r = this._renderer;
        if (!r._drawing || this._empty()) return;
        const ctx = r._ctx, p = this._point, R = this._radius * 1.12;
        const pts = [];
        for (let k = 0; k < 6; k++) {
          const a = (Math.PI / 3) * k - Math.PI / 2;
          pts.push([p.x + R * Math.cos(a), p.y + R * Math.sin(a)]);
        }
        // Start halfway along the last side, then round each corner
        ctx.beginPath();
        ctx.moveTo((pts[5][0] + pts[0][0]) / 2, (pts[5][1] + pts[0][1]) / 2);
        for (let k = 0; k < 6; k++) {
          const [x1, y1] = pts[k], [x2, y2] = pts[(k + 1) % 6];
          ctx.arcTo(x1, y1, x2, y2, R * 0.3);
        }
        ctx.closePath();
        ctx.lineJoin = "round";
        r._fillStroke(ctx, this);
      },
    });

    // A small dot for every community; the chosen one gets a pin
    const dots = places.map(([name, county, lat, lng], i) =>
      new HexMarker([lat, lng], { radius: 5, color: "#fff", weight: 1.5, fillColor: "#cc4b0c", fillOpacity: 1 })
        .bindTooltip(esc(name))
        // Stops here so the map's own click (leaving county view) doesn't fire
        .on("click", (e) => { L.DomEvent.stopPropagation(e); choose(i); })
        .addTo(map));
    let pin;

    const DOT = { radius: 5, fillOpacity: 1, opacity: 1 };
    const resetDots = () => dots.forEach((d) => d.setStyle(DOT).setRadius(5));
    let outline;
    const clearCounty = () => { if (outline) { outline.remove(); outline = null; } resetDots(); };
    const slug = (page) => page.replace(/^.*\//, "").replace(/\.html$/, "");
    // "Box Elder" -> "box-elder"
    const countySlug = (c) => c.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");

    function choose(i, fly = true) {
      const [name, county, lat, lng, page, seat] = places[i];
      clearCounty();
      showOverview(false);
      if (pin) pin.remove();
      if (fly) map.setView([lat, lng], 13);
      const fillPopup = (v) => Object.entries(v).reduce((h, [k, x]) => h.split(k).join(x), POPUP);
      pin = L.marker([lat, lng]).addTo(map)
        .bindPopup(fillPopup({
          "{Popup Town}": `<a href="${page}" class="marker-link link-icon font-zilla me-2">${esc(name)}, Utah</a>`,
          "{Popup County}": `<a href="?county=${countySlug(county)}" class="link-secondary county-link" data-county="${esc(county)}">${esc(county)} County</a>`,
          "{Popup Seat}": seat ? SEAT_ICON : "",
          "{Popup Open In}": openIn(name, lat, lng),
        }), { minWidth: 300, maxWidth: 380, className: "town-popup" })
        .openPopup();
      history.replaceState(null, "", `?town=${encodeURIComponent(slug(page))}`);
    }

    // County view: its outline and its towns' dots highlighted
    const outlines = {County Outlines JSON};
    let currentCounty = null;
    function chooseCounty(county) {
      clearCounty();
      currentCounty = county;
      showOverview(false);
      if (pin) { pin.remove(); pin = null; }
      const inCounty = places.map((p, i) => [p, i]).filter(([p]) => p[1] === county);
      if (!inCounty.length) return;
      dots.forEach((d, i) => {
        const yes = places[i][1] === county;
        d.setStyle(yes ? DOT : { fillOpacity: 0.35, opacity: 0.35 }).setRadius(yes ? 6 : 4);
      });
      const shape = outlines && outlines[county];
      if (shape) {
        // Not clickable, so taps reach the town dots inside it
        outline = L.geoJSON(shape, { interactive: false, style: { color: "#fff", weight: 3, opacity: 0.9, fill: false } }).addTo(map);
        map.fitBounds(outline.getBounds(), { padding: [20, 20] });
      } else {
        map.fitBounds(L.latLngBounds(inCounty.map(([p]) => [p[2], p[3]])), { padding: [40, 40] });
      }
      history.replaceState(null, "", `?county=${countySlug(county)}`);
    }
    // In county view, a click outside the county goes back to the whole
    // state's view (the map stays where it is)
    const inside = (latlng, rings) =>
      rings.some((ring) => {
        let isIn = false;
        for (let a = 0, b = ring.length - 1; a < ring.length; b = a++) {
          const [x1, y1] = ring[a], [x2, y2] = ring[b];
          if (y1 > latlng.lat !== y2 > latlng.lat &&
              latlng.lng < ((x2 - x1) * (latlng.lat - y1)) / (y2 - y1) + x1) isIn = !isIn;
        }
        return isIn;
      });
    const ringsOf = (g) => {
      const geom = g.type === "Feature" ? g.geometry : g.type === "FeatureCollection" ? null : g;
      if (!geom) return g.features.flatMap(ringsOf);
      return geom.type === "Polygon" ? [geom.coordinates[0]] : geom.type === "MultiPolygon" ? geom.coordinates.map((p) => p[0]) : [];
    };
    map.on("click", (e) => {
      if (!outline || !currentCounty) return;
      const shape = outlines && outlines[currentCounty];
      if (shape && inside(e.latlng, ringsOf(shape))) return;
      clearCounty();
      currentCounty = null;
      showOverview(true);
      history.replaceState(null, "", location.pathname);
    });

    // County links in a pin's popup switch views without reloading the page
    document.getElementById("full-map").addEventListener("click", (e) => {
      const c = e.target.closest(".county-link");
      if (c) { e.preventDefault(); chooseCounty(c.dataset.county); }
    });

    // Search: town names only; Enter picks the first match
    const search = document.getElementById("map-search");
    if (window.matchMedia("(max-width: 767.98px)").matches) search.placeholder = "Find a community ...";
    const results = document.getElementById("map-results");
    let matches = [];
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      matches = q ? places.map((p, i) => [p, i]).filter(([p]) => p[0].toLowerCase().includes(q))
        .sort(([a], [b]) => a[0].toLowerCase().indexOf(q) - b[0].toLowerCase().indexOf(q) || a[0].localeCompare(b[0]))
        .slice(0, 8) : [];
      results.innerHTML = matches.map(([p, i]) =>
        `<button type="button" data-i="${i}">${esc(p[0])} <span class="text-secondary">(${esc(p[1])})</span></button>`).join("");
    });
    search.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && matches.length) { e.preventDefault(); pick(matches[0][1]); }
    });
    results.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) pick(Number(b.dataset.i));
    });
    function pick(i) {
      search.value = "";
      results.innerHTML = "";
      matches = [];
      choose(i);
    }

    // Statewide view: every county line plus a heavier state line. Shown when
    // no town or county is picked.
    const state = {State Outline JSON};
    const overview = L.layerGroup();
    if (outlines) Object.values(outlines).forEach((g) =>
      L.geoJSON(g, { interactive: false, style: { color: "#fff", weight: 1, opacity: 0.6, fill: false } }).addTo(overview));
    if (state) L.geoJSON(state, { interactive: false, style: { color: "#fff", weight: 3, opacity: 0.95, fill: false } }).addTo(overview);
    const showOverview = (on) => on ? overview.addTo(map) : overview.remove();

    // Start on the community or county named in the address
    // (map.html?town=kanab or map.html?county=Kane), or show the whole state
    // County names match loosely: ?county=cache, ?county=box-elder and
    // ?county=Box%20Elder all work
    const params = new URLSearchParams(location.search);
    const start = places.findIndex((p) => slug(p[4]) === params.get("town"));
    const wantCounty = params.get("county") && countySlug(params.get("county").replace(/[- ]county$/i, ""));
    const startCounty = wantCounty && (places.find((p) => countySlug(p[1]) === wantCounty) || [])[1];
    if (start >= 0) choose(start);
    else if (startCounty) chooseCounty(startCounty);
    else {
      showOverview(true);
      map.fitBounds(L.latLngBounds(places.map((p) => [p[2], p[3]])), { padding: [20, 20] });
    }
  });
</script>
