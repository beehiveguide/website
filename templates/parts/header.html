<a
  href="#main"
  class="skip-link visually-hidden-focusable btn btn-light-box fw-bold"
  >Skip to main content</a
>
<header class="sticky-top bg-white border-bottom {Header Shadow} py-4 px-lg-5">
  <div
    class="container-fluid heading-container d-flex align-items-center justify-content-between"
  >
    <a
      href="{Home URL}"
      class="site-title h4 mb-0 text-decoration-none text-reset"
      >{Site Name}</a
    >
    <nav class="site-nav font-sans" aria-label="Site">
      <a href="{About URL}" class="link-secondary">
        About<svg
          class="nav-icon"
          viewBox="40.32 19 14.18 62"
          style="margin-left: 0.397em"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            stroke="currentColor"
            stroke-width=".985"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M 50.1 21 L 55 21 L 54.1 30.6 L 49.2 30.6 Z M 41.1 42.02 L 43.81 39.66 H 50.8 L 47.5 70.45 H 56.5 L 55.7 76.82 L 53.1 79 H 42.06 L 45.81 48.21 H 40.32 Z"
          ></path>
        </svg>
      </a>
      <a href="{Contact URL}" class="link-secondary">
        Contact<svg
          class="nav-icon"
          viewBox="0 0 40 40"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="3.8"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M3 14 L20 5 L37 14 V32 Q37 35 34 35 H6 Q3 35 3 32 Z M3 14 L20 26 L37 14"
          />
        </svg>
      </a>
      <a href="{Map URL}" class="link-secondary">
        Map<svg
          class="nav-icon"
          viewBox="0 0 42 44"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="3.8"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M3 9 L15 3 L27 9 L39 3 L39 35 L27 41 L15 35 L3 41 Z M15 3 L15 35 M27 9 L27 41"
          />
        </svg>
      </a>
    </nav>
  </div>
</header>
