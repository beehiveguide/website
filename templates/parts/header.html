<a
  href="#main"
  class="skip-link visually-hidden-focusable btn btn-light-box fw-bold"
  >Skip to main content</a
>
<header class="sticky-top bg-white border-bottom {Header Shadow} py-4 px-lg-5">
  <div
    class="container-fluid heading-container d-flex align-items-center justify-content-between"
  >
    <a
      href="{Home URL}"
      class="site-title h4 mb-0 text-decoration-none text-reset"
      >{Site Name}</a
    >
    <nav class="site-nav font-sans" aria-label="Site">
      <a href="{Blog URL}" class="link-secondary">
        Blog<svg
          class="nav-icon"
          viewBox="27 28.5 46 44.5"
          aria-hidden="true"
          focusable="false"
        >
          <!-- The open magazine from the tagline's hex icon, outlined, with a line down the spine -->
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="3.8"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M50 37 C44.8 32.9 37.6 31.5 32.2 32.6 Q29 33.4 29 36.8 L29 63.5 Q29 67.3 32.2 67 C38.6 65.9 45 66.6 48.3 69.3 Q50 70.7 51.7 69.3 C55 66.6 61.4 65.9 67.8 67 Q71 67.3 71 63.5 L71 36.8 Q71 33.4 67.8 32.6 C62.4 31.5 55.2 32.9 50 37 Z M50 37 V70"
          />
        </svg>
      </a>
      <a href="{Map URL}" class="link-secondary">
        Map<svg
          class="nav-icon"
          viewBox="0 0 42 44"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="3.8"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M3 12 Q3 9 5.68 7.66 L12.32 4.34 Q15 3 17.68 4.34 L24.32 7.66 Q27 9 29.68 7.66 L36.32 4.34 Q39 3 39 6 V32 Q39 35 36.32 36.34 L29.68 39.66 Q27 41 24.32 39.66 L17.68 36.34 Q15 35 12.32 36.34 L5.68 39.66 Q3 41 3 38 Z M15 3.7 V35.7 M27 8.3 V40.3"
          />
        </svg>
      </a>
      <a href="{Contact URL}" class="link-secondary">
        Contact<svg
          class="nav-icon"
          viewBox="0 0 40 40"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="3.8"
            stroke-linejoin="round"
            stroke-linecap="round"
            d="M3 17 Q3 14 5.65 12.6 L17.35 6.4 Q20 5 22.65 6.4 L34.35 12.6 Q37 14 37 17 V32 Q37 35 34 35 H6 Q3 35 3 32 Z M3.8 14.6 L20 26 L36.2 14.6"
          />
        </svg>
      </a>
      <a href="{About URL}" class="link-secondary">
        About<svg
          class="nav-icon nav-icon-hive"
          viewBox="0 0 40 40"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2.9"
            stroke-linejoin="round"
            stroke-linecap="round"
            transform="translate(0 1.9) translate(20 34) scale(1.1) translate(-20 -34)" d="M3 32 C3 29 4 25.5 5 22 C6 18 7.5 16 9 14 C11 11 14 5 20 5 C26 5 29 11 31 14 C32.5 16 34 18 35 22 C36 25.5 37 29 37 32 Q20 36.5 3 32 Z M9 14 Q20 17 31 14 M5 22 Q20 26 35 22"
          />
          <path fill="currentColor" transform="translate(0 0.7)" d="M15.6 34.5 V25.6 A4.4 4.4 0 0 1 24.4 25.6 V34.5 Z" />
        </svg>
      </a>
    </nav>
  </div>
</header>
