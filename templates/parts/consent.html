<!-- Privacy choices (static/js/consent.js). Shows until the visitor picks;
     the x hides it until their next visit. "Privacy choices" in the footer
     opens it again. -->
<section id="consent" class="consent card shadow font-sans" aria-labelledby="consent-title" hidden>
  <div class="card-body p-3">
    <button type="button" class="btn-close" data-consent="close" aria-label="Close"></button>
    <h2 id="consent-title" class="consent-title font-zilla fs-6 mb-1 pe-4">Privacy Choices</h2>
    <p class="small mb-2">{Consent Text}</p>
    <div id="consent-options" class="consent-options small mb-2" hidden>
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" id="consent-needed" checked disabled />
        <label class="form-check-label" for="consent-needed"><strong>Required</strong></label>
      </div>
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" id="consent-analytics" />
        <label class="form-check-label" for="consent-analytics"><strong>Analytics</strong>: visits and usage</label>
      </div>
      {Consent Ads Switch}
    </div>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <button type="button" class="btn btn-sm btn-outline-secondary" data-consent="reject">Reject all</button>
      <button type="button" class="btn btn-sm btn-secondary" data-consent="accept">Accept all</button>
      <button type="button" class="btn btn-sm btn-link link-secondary px-1" id="consent-more" aria-expanded="false" aria-controls="consent-options">Choices</button>
    </div>
  </div>
</section>
